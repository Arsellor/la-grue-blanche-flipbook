<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Flipbook musical interactif et responsive, conçu pour le portfolio de Tantchi.">
  <title>La Grue blanche — Flipbook musical</title>
  <link rel="stylesheet" href="css/flipbook.css">
</head>
<body>
  <a class="skip-link" href="#flipbook">Aller au flipbook</a>

  <main class="experience" id="main-content">
    <section class="flipbook-stage" aria-labelledby="flipbook-title">
      <header class="experience-header">
        <div class="title-group">
          <p class="eyebrow">EXPÉRIENCE INTERACTIVE</p>
          <h1 id="flipbook-title">La Grue blanche</h1>
        </div>

        <audio class="floating-audio" controls preload="metadata" aria-label="Bande sonore du flipbook">
          <source src="css/assets/musique/POLO%20%26%20PAN%20%23U2014%20Ani%20Kuni.mp3" type="audio/mpeg">
          Votre navigateur ne prend pas en charge l'audio HTML5.
        </audio>
      </header>

      <div class="book-area">
        <div class="book-shadow" aria-hidden="true"></div>
        <div id="flipbook" class="book" aria-label="Flipbook La Grue blanche">
          <article class="page page-cover" data-density="hard"><figure><img src="css/assets/page1.jpg" alt="Couverture illustrée de La Grue blanche" fetchpriority="high"></figure></article>
          <article class="page"><figure><img src="css/assets/page2.jpg" alt="Page 2 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page3.jpg" alt="Page 3 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page4.png" alt="Page 4 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page5.jpg" alt="Page 5 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page6.png" alt="Page 6 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page7.png" alt="Page 7 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page8.jpg" alt="Page 8 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page9.png" alt="Page 9 du livre illustré" loading="lazy"></figure></article>
          <article class="page"><figure><img src="css/assets/page10.png" alt="Page 10 du livre illustré" loading="lazy"></figure></article>
          <article class="page page-cover" data-density="hard"><figure><img src="css/assets/page11.jpg" alt="Dernière page du livre illustré" loading="lazy"></figure></article>
        </div>
      </div>

      <nav class="book-controls" aria-label="Navigation du flipbook">
        <button id="prevBtn" type="button" aria-label="Page précédente">‹</button>
        <output id="counter" aria-live="polite">1 / 11</output>
        <button id="nextBtn" type="button" aria-label="Page suivante">›</button>
      </nav>

      <p class="interaction-hint">Balayez ou utilisez les flèches pour tourner les pages.</p>
    </section>
  </main>

  <footer class="portfolio-footer">
    <p>Projet portfolio · HTML5 sémantique · CSS responsive · JavaScript</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="flipbook.js"></script>
</body>
</html>
